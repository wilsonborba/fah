name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  no-hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the fixed toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt,clippy
      - run: python3 scripts/prepare-dependencies.py
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo check --locked --features hosted-direct
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features hosted-direct
