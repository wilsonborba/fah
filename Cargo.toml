[package]
name = "fah"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Explicit USB host-controller research CLI"
repository = "https://github.com/wilsonborba/fah"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fah"
path = "src/main.rs"

[features]
default = []
hosted-direct = ["dep:crab-usb", "dep:vfio-ioctls", "crab-usb/hosted-direct", "dep:libc", "dep:vmm-sys-util", "dep:dma-api", "dep:futures"]

[dependencies]
crab-usb = { path = ".fah-cache/CrabUSB/usb-host", optional = true, default-features = false }
vfio-ioctls = { git = "https://github.com/rust-vmm/vfio", rev = "93bcf25f3f8196314a71173ae96749b269a65b19", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = { version = "0.2", optional = true }
vmm-sys-util = { version = "0.15", optional = true }
dma-api = { version = "=0.7.3", optional = true, features = ["fah-vfio"] }

[patch.crates-io]
dma-api = { path = ".fah-cache/dma-api" }

[dependencies.futures]
version = "0.3"
optional = true
default-features = false
features = ["std"]
